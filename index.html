<!doctype html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Egor Lapshin — backend developer. Event-driven microservices, gRPC, Kafka, and Web3 (Solana, TON) for fintech products."
    />
    <title>Egor Lapshin — Backend Developer</title>
    <script>
      (() => {
        try {
          const t = localStorage.getItem('el-theme')
          if (t === 'white' || t === 'obsidian') {
            document.documentElement.dataset.theme = t
          }
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
